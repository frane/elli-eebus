[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elli-eebus"
version = "0.1.0.dev0"
description = "Elli Charger over EEBUS: status, power limits and measurements (Elli Charger 2 and first generation)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frane Bandov" }]
requires-python = ">=3.11"
dependencies = ["pyeebus@https://github.com/frane/pyeebus/archive/0a255cd42abfa1629eaffc92e8cd8de3e44fc6b0.zip"]
keywords = ["elli", "wallbox", "ev-charger", "eebus", "home-assistant", "volkswagen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/frane/elli-eebus"
Issues = "https://github.com/frane/elli-eebus/issues"

[project.scripts]
elli-eebus = "ellieebus.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ellieebus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
